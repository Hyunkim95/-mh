name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: yarn

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build
        run: yarn build

      - name: Type check
        run: yarn type-check

      - name: Run tests with coverage
        run: yarn test --coverage

  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: yarn

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build
        run: yarn build

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Install Playwright
        run: npx playwright install --with-deps chromium

      - name: Start CI services
        run: docker compose -f docker-compose.ci.yml up -d --build

      - name: Wait for services to be healthy
        run: |
          set -euo pipefail
          echo "Waiting for services..."
          docker compose -f docker-compose.ci.yml ps
          services=("solana-validator" "postgres-e2e" "api-e2e")
          healthy=false
          # Wait up to 3 minutes for all services to be healthy
          for i in $(seq 1 36); do
            all_healthy=true
            for service in "${services[@]}"; do
              container_id="$(docker compose -f docker-compose.ci.yml ps -q "$service")"
              if [ -z "$container_id" ]; then
                echo "$service has no container yet"
                all_healthy=false
                continue
              fi

              status="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' "$container_id")"
              echo "$service status: $status"

              if [ "$status" != "healthy" ]; then
                all_healthy=false
              fi
            done

            if [ "$all_healthy" = "true" ]; then
              echo "All services healthy!"
              docker compose -f docker-compose.ci.yml ps
              healthy=true
              break
            else
              echo "Services still starting... ($i/36)"
              sleep 5
            fi
          done
          if [ "$healthy" != "true" ]; then
            echo "Services failed to become healthy in time"
            docker compose -f docker-compose.ci.yml ps
            echo ""
            echo "=== api-e2e logs ==="
            docker compose -f docker-compose.ci.yml logs api-e2e || true
            echo ""
            echo "=== postgres-e2e logs ==="
            docker compose -f docker-compose.ci.yml logs postgres-e2e || true
            echo ""
            echo "=== solana-validator logs ==="
            docker compose -f docker-compose.ci.yml logs solana-validator || true
            exit 1
          fi

      - name: Run API E2E tests
        run: yarn test:e2e
        env:
          CI: true

      - name: Dump service logs on E2E failure
        if: failure()
        run: |
          echo "=== api-e2e logs ==="
          docker compose -f docker-compose.ci.yml logs api-e2e || true
          echo ""
          echo "=== postgres-e2e logs ==="
          docker compose -f docker-compose.ci.yml logs postgres-e2e || true
          echo ""
          echo "=== solana-validator logs ==="
          docker compose -f docker-compose.ci.yml logs solana-validator || true

      - name: Run Browser E2E tests
        run: npx playwright test --config e2e-browser/playwright.config.ts
        env:
          CI: true

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: e2e-browser/test-results/
          retention-days: 7

      - name: Teardown services
        if: always()
        run: docker compose -f docker-compose.ci.yml down -v
