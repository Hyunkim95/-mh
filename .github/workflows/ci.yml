name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: yarn

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build
        run: yarn build

      - name: Type check
        run: yarn type-check

      - name: Run tests with coverage
        run: yarn test --coverage

  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: yarn

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build
        run: yarn build

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Install Playwright
        run: npx playwright install --with-deps chromium

      - name: Start CI services
        run: docker compose -f docker-compose.ci.yml up -d --build

      - name: Wait for services to be healthy
        run: |
          echo "Waiting for services..."
          docker compose -f docker-compose.ci.yml ps
          # Wait up to 3 minutes for all services to be healthy
          for i in $(seq 1 36); do
            if docker compose -f docker-compose.ci.yml ps | grep -q "unhealthy\|starting"; then
              echo "Services still starting... ($i/36)"
              sleep 5
            else
              echo "All services healthy!"
              docker compose -f docker-compose.ci.yml ps
              break
            fi
          done

      - name: Run API E2E tests
        run: yarn test:e2e
        env:
          CI: true

      - name: Run Browser E2E tests
        run: npx playwright test --config e2e-browser/playwright.config.ts
        env:
          CI: true

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: e2e-browser/test-results/
          retention-days: 7

      - name: Teardown services
        if: always()
        run: docker compose -f docker-compose.ci.yml down -v
