<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Primary Meta Tags -->
    <title>MultiHopper - Programmable Privacy for Solana</title>
    <meta name="title" content="MultiHopper - Programmable Privacy for Solana" />
    <meta name="description" content="Send any amount of tokens onchain privately. Route through any wallets you can imagine. Control how long assets stay in each hop wallet." />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://multihopper.com/" />
    <meta property="og:title" content="MultiHopper - Programmable Privacy for Solana" />
    <meta property="og:description" content="Send any amount of tokens onchain privately. Route through any wallets you can imagine. Control how long assets stay in each hop wallet." />
    <meta property="og:site_name" content="MultiHopper" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary" />
    <meta property="twitter:url" content="https://multihopper.com/" />
    <meta property="twitter:title" content="MultiHopper - Programmable Privacy for Solana" />
    <meta property="twitter:description" content="Send any amount of tokens onchain privately. Route through any wallets you can imagine. Control how long assets stay in each hop wallet." />

    <!-- Additional SEO -->
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://multihopper.com/" />
    <meta name="theme-color" content="#16181A" />
    <meta name="keywords" content="programmable privacy, Solana, multi-hop transactions, crypto routing, blockchain privacy, SPL tokens, digital asset routing" />
    <meta name="author" content="MultiHopper" />
    <meta name="application-name" content="MultiHopper" />
    <meta name="fragment" content="!" />

    <!-- JSON-LD Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "MultiHopper",
      "url": "https://multihopper.com",
      "description": "Programmable privacy routing protocol for digital assets on Solana"
    }
    </script>
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "MultiHopper",
      "applicationCategory": "Blockchain Infrastructure",
      "operatingSystem": "Solana Blockchain",
      "description": "Programmable privacy routing protocol for digital assets enabling configurable multi-hop crypto transactions across existing on-chain wallets and smart contracts.",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD"
      }
    }
    </script>
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "MultiHopper",
      "url": "https://multihopper.com"
    }
    </script>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rowdies:wght@400;700&family=Roboto:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
