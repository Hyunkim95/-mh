[build]
  base = "."
  publish = "apps/web/dist"
  command = "yarn workspace @trpc-template/server build && yarn workspace @trpc-template/client build && yarn workspace @trpc-template/web build"

[[redirects]]
  from = "/trpc/*"
  to = "https://multihopper-prod-db4f6830ced3.herokuapp.com/trpc/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Deployment-detection endpoint must never be cached so the SPA polling hook
# (libs/client/src/hooks/useDeploymentCheck.ts) always sees the live version.
[[headers]]
  for = "/version.json"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Netlify-CDN-Cache-Control = "public, max-age=0, must-revalidate"
